<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day 7 - 每週天氣溫度折線圖</title>
</head>
<body>
  <div style="width: 700px; margin: 40px auto;">
    <canvas id="weatherChart"></canvas>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1"></script>
  <script>
    new Chart(document.getElementById('weatherChart'), {
      type: 'line',
      data: {
        labels: ['週一', '週二', '週三', '週四', '週五', '週六', '週日'],
        datasets: [
          {
            label: '最高溫',
            data: [30, 31, 29, 33, 32, 28, 27],
            borderColor: 'rgb(255, 99, 132)',
            backgroundColor: 'rgba(255, 99, 132, 0.3)',
            tension: 0.3,
            fill: true
          },
          {
            label: '最低溫',
            data: [22, 23, 21, 24, 23, 20, 19],
            borderColor: 'rgb(54, 162, 235)',
            backgroundColor: 'rgba(54, 162, 235, 0.3)',
            tension: 0.3,
            fill: true
          }
        ]
      },
      options: {
        responsive: true,
        plugins: {
          title: { display: true, text: '本週天氣溫度變化' },
          legend: { position: 'top' },
          tooltip: {
            callbacks: {
              label: (context) => `${context.dataset.label}：${context.parsed.y}°C`
            }
          }
        },
        scales: {
          x: {
            title: { display: true, text: '星期' }
          },
          y: {
            beginAtZero: true,
            title: { display: true, text: '氣溫（°C）' }
          }
        }
      }
    });
  </script>
</body>
</html>
